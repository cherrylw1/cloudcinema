name: Deploy Cloudflare Drive Stream Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/drive-worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Drive stream Worker
        working-directory: cloudflare/drive-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
