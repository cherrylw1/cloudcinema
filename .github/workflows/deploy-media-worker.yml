name: Deploy Cloudflare Media Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/media-worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy media Worker
        working-directory: cloudflare/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_R2_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@latest deploy

      - name: Configure Worker signing secret
        working-directory: cloudflare/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_R2_ACCOUNT_ID != '' && secrets.MEDIA_SIGNING_SECRET != '' }}
        run: printf '%s' "$MEDIA_SIGNING_SECRET" | npx --yes wrangler@latest secret put MEDIA_SIGNING_SECRET
